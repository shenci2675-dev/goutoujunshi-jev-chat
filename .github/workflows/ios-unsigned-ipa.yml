# =============================================================================
# 浜戞瀯寤恒€屾湭绛惧悕鐪熸満 IPA銆?#
# 鏀惧埌浠撳簱鐨勶細  .github/workflows/ios-unsigned-ipa.yml
#
# 浜х墿锛欸outouJunshi-unsigned.ipa锛圥ayload/GoutouJunshi.app锛宎rm64锛宒evice 鏋勫缓锛?#       鍖呮湰韬笉鑳界洿瑁?iPhone锛岄渶瑕?Sideloadly / AltStore 鐢ㄤ綘鑷繁鐨?Apple ID
#       閲嶇鍚庢墠鑳藉畨瑁咃紙璇﹁鍚岀洰褰?README锛夈€?#
# 涓や釜鍑哄彛锛屼换閫夊叾涓€锛?#   1. Actions 鈫?鏈杩愯 鈫?Artifacts 鈫?GoutouJunshi-unsigned-ipa
#   2. 鍒嗘敮 unsigned-ipa锛坵orkflow 浼氭妸 ipa 鍗曠嫭鎻愪氦鍒颁竴涓?orphan 鍒嗘敮锛夛紝
#      鍙洿鎺?https://codeload.github.com/<owner>/<repo>/zip/refs/heads/unsigned-ipa
#      涓嬭浇 zip 鍚庤В鍘嬫嬁鍖?鈥斺€?缁?github.com 琚銆乷bjects.githubusercontent.com
#      杩炰笉涓婄殑缃戠粶鐢ㄣ€?#
# 宸叉寜 shengjidaguai-china/goutoujunshi-jev-chat 鐨勫疄闄呯粨鏋勯璁撅細
#   project = integrations/jev_ios/GoutouJunshi.xcodeproj
#   scheme  = GoutouJunshi锛堜粨搴撻噷鍞竴鐨?shared scheme锛?# =============================================================================
name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      project:
        description: "xcodeproj 鐩稿璺緞"
        required: false
        default: "integrations/jev_ios/GoutouJunshi.xcodeproj"
      scheme:
        description: "Xcode scheme锛堢暀绌哄垯鑷姩鎺㈡祴锛?
        required: false
        default: "GoutouJunshi"
  push:
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: write

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 閫夌敤鏈€鏂扮殑 Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "--- 闀滃儚閲岄瑁呯殑 Xcode ---"
          ls -d /Applications/Xcode*.app || true
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "${latest}" ]; then
            echo "鍒囨崲鍒?${latest}"
            sudo xcode-select -s "${latest}/Contents/Developer" || true
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 纭畾 project / scheme
        id: probe
        shell: bash
        env:
          PROJ_INPUT: ${{ github.event.inputs.project }}
          SCHEME_INPUT: ${{ github.event.inputs.scheme }}
        run: |
          set -euo pipefail
          PROJ="${PROJ_INPUT:-integrations/jev_ios/GoutouJunshi.xcodeproj}"
          if [ ! -d "${PROJ}" ]; then
            echo "::error::鎵句笉鍒板伐绋嬬洰褰?${PROJ}"
            exit 1
          fi
          SCHEME="${SCHEME_INPUT:-}"
          if [ -z "${SCHEME}" ]; then
            SCHEME="$(xcodebuild -list -project "${PROJ}" 2>/dev/null \
              | awk '/^[[:space:]]*Schemes:/{f=1;next} f && /^[[:space:]]*$/{exit} f{gsub(/^[[:space:]]+/,""); if(length($0)){print;exit}}')"
          fi
          [ -n "${SCHEME}" ] || SCHEME="GoutouJunshi"
          echo "project=${PROJ}" >> "${GITHUB_OUTPUT}"
          echo "scheme=${SCHEME}"  >> "${GITHUB_OUTPUT}"
          echo "鏈浣跨敤锛?project=${PROJ}  scheme=${SCHEME}"
          xcodebuild -list -project "${PROJ}"

      - name: 缂栬瘧锛堝叧闂唬鐮佺鍚嶏紝device / arm64锛?        shell: bash
        env:
          PROJ: ${{ steps.probe.outputs.project }}
          SCHEME: ${{ steps.probe.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJ}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 缁勮 Payload 骞舵墦鍖?ipa
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="${RUNNER_TEMP}/dd/Build/Products/Release-iphoneos"
          APP="$(find "${PRODUCT_DIR}" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "${APP}" ]; then
            echo "::error::娌℃湁鎵惧埌 .app锛屼笅闈㈡槸浜х墿鐩綍锛?
            ls -la "${PRODUCT_DIR}" || true
            exit 1
          fi
          APP_NAME="$(basename "${APP}" .app)"
          echo "鎵惧埌 ${APP_NAME}.app"
          echo "--- 鍐呭祵鎵╁睍 ---"
          ls "${APP}/PlugIns" 2>/dev/null || echo "(娌℃湁 PlugIns 鐩綍)"

          STAGE="${RUNNER_TEMP}/stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          cp -R "${APP}" "${STAGE}/Payload/"

          IPA="${RUNNER_TEMP}/${APP_NAME}-unsigned.ipa"
          ( cd "${STAGE}" && ditto -c -k --sequesterRsrc --keepParent Payload "${IPA}" )

          echo "ipa=${IPA}" >> "${GITHUB_OUTPUT}"
          echo "app_name=${APP_NAME}" >> "${GITHUB_OUTPUT}"

          echo "--- ipa 缁撴瀯锛堝墠 20 琛岋級---"
          unzip -l "${IPA}" | head -n 20
          echo "--- 鍙墽琛屾枃浠舵灦鏋勶紙搴斾负 arm64锛?--"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Info.plist")"
          file "${APP}/${BIN}" || true
          echo "鏈€灏忕郴缁熺増鏈細"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${APP}/Info.plist" || true
          shasum -a 256 "${IPA}"
          ls -lh "${IPA}"

      - name: 涓婁紶 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoutouJunshi-unsigned-ipa
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: 鎶?ipa 鎺ㄥ埌 unsigned-ipa 鍒嗘敮锛堢粰鍙楅檺缃戠粶鐩存帴涓嬭浇锛?        if: success()
        shell: bash
        env:
          IPA_PATH: ${{ steps.pack.outputs.ipa }}
          APP_NAME: ${{ steps.pack.outputs.app_name }}
          # run 姝ラ閲屾病鏈夐粯璁ょ殑 GITHUB_TOKEN 鐜鍙橀噺锛屽繀椤绘樉寮忔槧灏?          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/ipa-branch"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          cp "${IPA_PATH}" "${OUT}/${APP_NAME}-unsigned.ipa"
          ( cd "${OUT}" && shasum -a 256 *.ipa > SHA256SUMS.txt )

          cd "${OUT}"
          git init -q
          git checkout -q -b unsigned-ipa
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "unsigned ipa $(date -u +%Y%m%dT%H%M%SZ)"
          if git push -q --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" unsigned-ipa; then
            echo "宸叉帹閫侊細https://codeload.github.com/${GITHUB_REPOSITORY}/zip/refs/heads/unsigned-ipa"
          else
            # 鍒嗘敮鍙槸銆屽彈闄愮綉缁滀笅杞姐€嶇殑澶囩敤閫氶亾锛屽け璐ヤ笉褰卞搷 Artifacts 閲岀殑鎴愬搧
            echo "::warning::鎺ㄩ€佸埌 unsigned-ipa 鍒嗘敮澶辫触锛岃鐢ㄦ湰娆¤繍琛岀殑 Artifacts 涓嬭浇"
          fi

      - name: 缁撴灉鎽樿
        if: always()
        shell: bash
        run: |
          {
            echo "### 鏋勫缓${{ job.status }}"
            echo ""
            echo "- App锛歕`${{ steps.pack.outputs.app_name }}\`"
            echo "- 杩欎釜鍖呮槸**鏈鍚?*鐨勶紝涓嶈兘鐩存帴瀹夎鍒?iPhone銆?
            echo "- 涓嬭浇锛氭湰娆¤繍琛?Artifacts锛屾垨鍒嗘敮 \`unsigned-ipa\` 鐨?zip銆?
            echo "- 涓嬩竴姝ワ細Sideloadly 鐢ㄤ綘鐨?Apple ID 閲嶇瀹夎銆?
          } >> "${GITHUB_STEP_SUMMARY}"
